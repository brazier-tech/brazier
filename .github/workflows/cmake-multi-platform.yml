name: CMake Multi-Platform Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  resolve:
    runs-on: ubuntu-latest
    outputs:
      logger_ref: ${{ steps.r.outputs.logger_ref }}
      orm_ref:    ${{ steps.r.outputs.orm_ref }}
    steps:
      - name: Resolve master SHAs
        id: r
        shell: bash
        run: |
          LOGGER_SHA=$(git ls-remote https://github.com/brazier-tech/brazier-logger.git master | awk '{print $1}')
          ORM_SHA=$(git ls-remote https://github.com/brazier-tech/brazierORM.git master | awk '{print $1}')
          echo "logger_ref=$LOGGER_SHA" >> $GITHUB_OUTPUT
          echo "orm_ref=$ORM_SHA"       >> $GITHUB_OUTPUT
          echo "resolved logger: $LOGGER_SHA"
          echo "resolved orm:    $ORM_SHA"

  linux:
    needs: resolve
    runs-on: ubuntu-latest

    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/registry/ports
      BRAZIER_LOGGER_REF:  ${{ needs.resolve.outputs.logger_ref }}
      BRAZIER_ORM_REF:     ${{ needs.resolve.outputs.orm_ref }}
      BRAZIER_CORE_REF:    ${{ github.sha }}
      VCPKG_KEEP_ENV_VARS: "BRAZIER_LOGGER_REF;BRAZIER_ORM_REF;BRAZIER_CORE_REF"

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
        shared_libs: [ON, OFF]
        include:
          - compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
          - compiler: clang
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - name: Checkout brazier
      uses: actions/checkout@v4

    - name: Checkout brazier-registry
      uses: actions/checkout@v4
      with:
        repository: brazier-tech/brazier-registry
        path: registry
        ref: for-local-using

    - name: Debug refs
      shell: bash
      run: |
        echo "=== ENV ==="
        echo "BRAZIER_LOGGER_REF  = $BRAZIER_LOGGER_REF"
        echo "BRAZIER_ORM_REF     = $BRAZIER_ORM_REF"
        echo "BRAZIER_CORE_REF    = $BRAZIER_CORE_REF"
        echo "VCPKG_OVERLAY_PORTS = $VCPKG_OVERLAY_PORTS"
        echo "VCPKG_KEEP_ENV_VARS = $VCPKG_KEEP_ENV_VARS"

    - name: Start Redis
      run: |
        docker run -d --name redis -p 6379:6379 redis:latest
        for i in {1..30}; do
          docker exec redis redis-cli ping && break || sleep 1
        done

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'brazier/vcpkg.json'

    - name: Set VCPKG_ROOT
      shell: bash
      run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }}
        -DBUILD_TESTS=ON
        -DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/registry/ports
        -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        -S brazier

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Create config_test.json
      working-directory: build
      run: |
        cat > config_test.json <<'EOF'
        {
          "app_name": "brazierApp",
          "https_server": {
            "host": "0.0.0.0",
            "port": 8443,
            "tls": {
              "cert_file": "brazier/app/certs/server.crt",
              "key_file": "brazier/app/certs/server.key",
              "ca_file": "",
              "require_client_cert": false,
              "verify_client_cert": false,
              "handshake_timeout": 3,
              "conf": []
            }
          },
          "http": {
            "max_connections_testing": 20,
            "max_body_size_testing": 1048576,
            "max_header_size_testing": 8192
          }
        }
        EOF
        mkdir -p ${{ matrix.build_type }}
        cp config_test.json ${{ matrix.build_type }}/
      shell: bash

    - name: Generate self-signed certificate (main server)
      run: |
        mkdir -p build/brazier/app/certs
        openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes \
          -keyout build/brazier/app/certs/server.key \
          -out build/brazier/app/certs/server.crt \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      shell: bash

    - name: Generate mTLS certificates (CA + client)
      run: |
        set -e
        mkdir -p build/certs
        cd build/certs

        openssl genrsa -out ca.key 4096
        openssl req -x509 -new -nodes -key ca.key -sha256 -days 1825 \
          -out ca.crt -subj "/CN=Test CA"

        openssl genrsa -out server.key 2048
        openssl req -new -key server.key -out server.csr -subj "/CN=localhost"
        echo "subjectAltName=DNS:localhost,IP:127.0.0.1" > server_ext.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
          -CAcreateserial -out server.crt -days 365 -sha256 \
          -extfile server_ext.cnf

        openssl genrsa -out client.key 2048
        openssl req -new -key client.key -out client.csr -subj "/CN=brazier-client"
        echo "extendedKeyUsage=clientAuth" > client_ext.cnf
        openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key \
          -CAserial ca.srl -out client.crt -days 365 -sha256 \
          -extfile client_ext.cnf

        openssl verify -CAfile ca.crt server.crt
        openssl verify -CAfile ca.crt client.crt
      shell: bash

    - name: Run tests
      working-directory: build
      run: ./brazier_tests
      shell: bash

  windows:
    needs: resolve
    runs-on: windows-latest

    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/registry/ports
      BRAZIER_LOGGER_REF:  ${{ needs.resolve.outputs.logger_ref }}
      BRAZIER_ORM_REF:     ${{ needs.resolve.outputs.orm_ref }}
      BRAZIER_CORE_REF:    ${{ github.sha }}
      VCPKG_KEEP_ENV_VARS: "BRAZIER_LOGGER_REF;BRAZIER_ORM_REF;BRAZIER_CORE_REF"

    strategy:
      fail-fast: false
      matrix:
        compiler: [cl]
        build_type: [Release, Debug]
        shared_libs: [ON, OFF]
        include:
          - compiler: cl
            c_compiler: cl
            cpp_compiler: cl

    steps:
    - name: Checkout brazier
      uses: actions/checkout@v4

    - name: Checkout brazier-registry
      uses: actions/checkout@v4
      with:
        repository: brazier-tech/brazier-registry
        path: registry
        ref: for-local-using

    - name: Debug refs
      shell: bash
      run: |
        echo "=== ENV ==="
        echo "BRAZIER_LOGGER_REF  = $BRAZIER_LOGGER_REF"
        echo "BRAZIER_ORM_REF     = $BRAZIER_ORM_REF"
        echo "BRAZIER_CORE_REF    = $BRAZIER_CORE_REF"
        echo "VCPKG_OVERLAY_PORTS = $VCPKG_OVERLAY_PORTS"
        echo "VCPKG_KEEP_ENV_VARS = $VCPKG_KEEP_ENV_VARS"

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'brazier/vcpkg.json'

    - name: Set VCPKG_ROOT
      shell: bash
      run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }}
        -DBUILD_TESTS=ON
        -DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/registry/ports
        -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        -S brazier

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Copy DLLs to test directory
      run: |
        $dest = "build\${{ matrix.build_type }}"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        if ("${{ matrix.build_type }}" -eq "Release") {
          Copy-Item -Path "build\vcpkg_installed\x64-windows\bin\*.dll" -Destination $dest -ErrorAction SilentlyContinue
        } else {
          Copy-Item -Path "build\vcpkg_installed\x64-windows\debug\bin\*.dll" -Destination $dest -ErrorAction SilentlyContinue
        }
      shell: pwsh

    - name: Create config_test.json
      working-directory: build
      run: |
        cat > config_test.json <<'EOF'
        {
          "app_name": "brazierApp",
          "https_server": {
            "host": "0.0.0.0",
            "port": 8443,
            "tls": {
              "cert_file": "brazier/app/certs/server.crt",
              "key_file": "brazier/app/certs/server.key",
              "ca_file": "",
              "require_client_cert": false,
              "verify_client_cert": false,
              "handshake_timeout": 3,
              "conf": []
            }
          },
          "http": {
            "max_connections_testing": 20,
            "max_body_size_testing": 1048576,
            "max_header_size_testing": 8192
          }
        }
        EOF
        mkdir -p ${{ matrix.build_type }}
        cp config_test.json ${{ matrix.build_type }}/
      shell: bash

    - name: Generate self-signed certificate (main server)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build/brazier/app/certs" | Out-Null
        openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes `
          -keyout "build/brazier/app/certs/server.key" `
          -out "build/brazier/app/certs/server.crt" `
          -subj "/CN=localhost" `
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

    - name: Generate mTLS certificates (CA + client)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build/certs" | Out-Null
        Push-Location build/certs

        openssl genrsa -out ca.key 4096
        openssl req -x509 -new -nodes -key ca.key -sha256 -days 1825 -out ca.crt -subj "/CN=Test CA"

        openssl genrsa -out server.key 2048
        openssl req -new -key server.key -out server.csr -subj "/CN=localhost"
        Set-Content -Path server_ext.cnf -Value "subjectAltName=DNS:localhost,IP:127.0.0.1"
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 365 -sha256 -extfile server_ext.cnf

        openssl genrsa -out client.key 2048
        openssl req -new -key client.key -out client.csr -subj "/CN=brazier-client"
        Set-Content -Path client_ext.cnf -Value "extendedKeyUsage=clientAuth"
        openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAserial ca.srl -out client.crt -days 365 -sha256 -extfile client_ext.cnf

        openssl verify -CAfile ca.crt server.crt
        openssl verify -CAfile ca.crt client.crt

        Pop-Location

    - name: Run tests
      working-directory: build
      run: ./${{ matrix.build_type }}/brazier_tests.exe
      shell: bash

  macos:
    needs: resolve
    runs-on: macos-latest

    env:
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/registry/ports
      BRAZIER_LOGGER_REF:  ${{ needs.resolve.outputs.logger_ref }}
      BRAZIER_ORM_REF:     ${{ needs.resolve.outputs.orm_ref }}
      BRAZIER_CORE_REF:    ${{ github.sha }}
      VCPKG_KEEP_ENV_VARS: "BRAZIER_LOGGER_REF;BRAZIER_ORM_REF;BRAZIER_CORE_REF"

    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
        build_type: [Release, Debug]
        shared_libs: [ON, OFF]
        include:
          - compiler: clang
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - name: Checkout brazier
      uses: actions/checkout@v4

    - name: Checkout brazier-registry
      uses: actions/checkout@v4
      with:
        repository: brazier-tech/brazier-registry
        path: registry
        ref: for-local-using

    - name: Debug refs
      shell: bash
      run: |
        echo "=== ENV ==="
        echo "BRAZIER_LOGGER_REF  = $BRAZIER_LOGGER_REF"
        echo "BRAZIER_ORM_REF     = $BRAZIER_ORM_REF"
        echo "BRAZIER_CORE_REF    = $BRAZIER_CORE_REF"
        echo "VCPKG_OVERLAY_PORTS = $VCPKG_OVERLAY_PORTS"
        echo "VCPKG_KEEP_ENV_VARS = $VCPKG_KEEP_ENV_VARS"

    - name: Install system dependencies
      run: brew install autoconf

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'brazier/vcpkg.json'

    - name: Set VCPKG_ROOT
      shell: bash
      run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }}
        -DBUILD_TESTS=ON
        -DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/registry/ports
        -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        -S brazier

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Create config_test.json
      working-directory: build
      run: |
        cat > config_test.json <<'EOF'
        {
          "app_name": "brazierApp",
          "https_server": {
            "host": "0.0.0.0",
            "port": 8443,
            "tls": {
              "cert_file": "brazier/app/certs/server.crt",
              "key_file": "brazier/app/certs/server.key",
              "ca_file": "",
              "require_client_cert": false,
              "verify_client_cert": false,
              "handshake_timeout": 3,
              "conf": []
            }
          },
          "http": {
            "max_connections_testing": 20,
            "max_body_size_testing": 1048576,
            "max_header_size_testing": 8192
          }
        }
        EOF
        mkdir -p ${{ matrix.build_type }}
        cp config_test.json ${{ matrix.build_type }}/
      shell: bash

    - name: Generate self-signed certificate (main server)
      run: |
        mkdir -p build/brazier/app/certs
        cd build/brazier/app/certs
        echo "subjectAltName=DNS:localhost,IP:127.0.0.1" > server_ext.cnf
        openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes \
          -keyout server.key -out server.crt \
          -subj "/CN=localhost" \
          -extensions v3_req \
          -config <(cat /etc/ssl/openssl.cnf; echo "[v3_req]"; echo "subjectAltName=DNS:localhost,IP:127.0.0.1")
      shell: bash

    - name: Generate mTLS certificates (CA + client)
      run: |
        set -e
        mkdir -p build/certs
        cd build/certs

        openssl genrsa -out ca.key 4096
        openssl req -x509 -new -nodes -key ca.key -sha256 -days 1825 \
          -out ca.crt -subj "/CN=Test CA"

        openssl genrsa -out server.key 2048
        openssl req -new -key server.key -out server.csr -subj "/CN=localhost"
        echo "subjectAltName=DNS:localhost,IP:127.0.0.1" > server_ext.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
          -CAcreateserial -out server.crt -days 365 -sha256 \
          -extfile server_ext.cnf

        openssl genrsa -out client.key 2048
        openssl req -new -key client.key -out client.csr -subj "/CN=brazier-client"
        echo "extendedKeyUsage=clientAuth" > client_ext.cnf
        openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key \
          -CAserial ca.srl -out client.crt -days 365 -sha256 \
          -extfile client_ext.cnf

        openssl verify -CAfile ca.crt server.crt
        openssl verify -CAfile ca.crt client.crt
      shell: bash

    - name: Run tests
      working-directory: build
      run: ./brazier_tests --gtest_filter=-RoutingTest.*
      shell: bash